name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The numbers behind /impact/, which the build needs.
      - run: npm run impact
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Fails on dead Markdown links and invalid frontmatter, papers.bib, team.yaml or impact.yaml.
      - run: npm run build

      # Links in the built HTML, the old WordPress URLs, redirects and media budgets.
      - run: npm run check
