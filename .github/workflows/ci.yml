name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails on dead Markdown links and invalid frontmatter, papers.bib or team.yaml.
      - run: npm run build

      # Links in the built HTML, the old WordPress URLs, redirects and media budgets.
      - run: npm run check
