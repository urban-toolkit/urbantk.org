name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/configure-pages@v6

      - run: npm ci

      # Stars, commits, downloads, Curio's examples and datasets, and the papers' use cases for /impact/.
      - run: npm run impact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GitHub lists stargazers only to personal tokens; without this secret, stars read "Not reported".
          STARS_TOKEN: ${{ secrets.IMPACT_GITHUB_TOKEN }}

      - run: npm run build

      - run: npm run check

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

      - uses: actions/deploy-pages@v5
        id: deployment
