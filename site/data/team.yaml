# People of the Urban Toolkit. /team/ shows the `groups` below in order as cards (with `photo`, a 128 px WebP
# in site/public/media/team/, or initials), then `alumni: true`, then the `compact` groups as a plain list of
# names and institutions. Visiting students are listed at UIC, with their home university in `role`.
# Project pages list people by id (`team:` in their frontmatter), and author names in papers.bib that
# match a name or one of its `aliases` link to the person's page.
# `listed: false` marks collaborators who appear on project pages but not on /team/.

institutions:
  - id: uic
    name: University of Illinois Chicago
    url: https://www.uic.edu/
  - id: berkeley
    name: University of California, Berkeley
    url: https://www.berkeley.edu/
  - id: uff
    name: Universidade Federal Fluminense
    url: https://www.uff.br/
  - id: ufpe
    name: Universidade Federal de Pernambuco
    url: https://www.ufpe.br/
  - id: uiuc
    name: University of Illinois Urbana-Champaign
    url: https://illinois.edu/
  - id: polimi
    name: Politecnico di Milano
    url: https://www.polimi.it/

groups:
  - { id: faculty, label: Faculty }
  - { id: staff, label: Research staff }
  - { id: phd, label: PhD students }
  - { id: msc, label: MSc students }
  - { id: undergrad, label: Undergraduate students }
  - { id: visiting, label: Visiting students }
  - { id: collaborators, label: Collaborators, compact: true }

